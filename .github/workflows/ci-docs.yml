# ============================================================================
# TERRAFORM DOCUMENTATION WORKFLOW
# ============================================================================
# This workflow keeps module README files aligned with the Terraform interface
# defined in the shared modules repository.
#
# Its purpose is to preserve a clear separation between:
# - hand-written usage and design guidance
# - generated Terraform reference content
#
# WHAT THIS WORKFLOW CHECKS:
# - Module README files exist and can be refreshed with terraform-docs
# - Generated sections stay aligned with current module inputs and outputs
# - Pull requests fail when generated documentation is outdated
#
# WHAT THIS WORKFLOW DOES NOT CHECK:
# - Terraform syntax or linting quality
# - Real AWS authentication
# - terraform plan/apply against live environments
# - Module runtime behavior inside consumer blueprints
#
# WHY THIS WORKFLOW MATTERS:
# - It reduces documentation drift across shared modules
# - It keeps the module contract visible to consumers
# - It supports a maintainable documentation standard at repository scale
# ============================================================================

name: Terraform Docs

# ============================================================================
# WORKFLOW TRIGGERS
# ============================================================================
# The workflow runs when module content or documentation-rendering
# configuration changes. It validates documentation freshness in pull
# requests and can auto-refresh README files on branch pushes.
# ============================================================================
on:
  push:
    branches:
      - dev
      - main
    paths:
      - "modules/**"
      - ".github/quality/terraform-docs.yml"
      - ".github/workflows/ci-docs.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "modules/**"
      - ".github/quality/terraform-docs.yml"
      - ".github/workflows/ci-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# ============================================================================
# JOBS
# ============================================================================
# The workflow is split into small jobs so that we can:
# - discover module directories dynamically
# - validate README freshness during pull requests
# - refresh README files automatically on pushes
# - exit cleanly when no module folders exist yet
# ============================================================================
jobs:
  discover-modules:
    # This job builds the module list dynamically from modules/*.
    #
    # Why dynamic discovery?
    # - New modules are picked up automatically
    # - The workflow does not need to be edited for every new folder
    # - Documentation remains scalable as the repository grows
    name: Discover Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
      has_modules: ${{ steps.discover.outputs.has_modules }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Discover Module Directories
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          # If the modules directory does not exist yet, publish an empty
          # result and let the workflow stop gracefully.
          if [ ! -d modules ]; then
            echo "modules=[]" >> "${GITHUB_OUTPUT}"
            echo "has_modules=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Build a JSON array of first-level module directories so it can be
          # reused by later jobs if needed and so the workflow can decide
          # whether documentation work is required at all.
          MODULES_JSON=$(find modules -mindepth 1 -maxdepth 1 -type d | sort | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')

          if [ "${MODULES_JSON}" = "[]" ]; then
            echo "modules=[]" >> "${GITHUB_OUTPUT}"
            echo "has_modules=false" >> "${GITHUB_OUTPUT}"
          else
            echo "modules=${MODULES_JSON}" >> "${GITHUB_OUTPUT}"
            echo "has_modules=true" >> "${GITHUB_OUTPUT}"
          fi

  check-docs:
    # Pull requests should not modify module code without updating the
    # generated Terraform reference embedded in each module README.
    name: Check Module READMEs
    runs-on: ubuntu-latest
    needs:
      - discover-modules
    if: github.event_name == 'pull_request' && needs.discover-modules.outputs.has_modules == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install terraform-docs
        shell: bash
        run: |
          set -euo pipefail

          # We install terraform-docs manually to avoid depending on external
          # GitHub Actions that may be blocked by enterprise allowlists.
          TERRAFORM_DOCS_VERSION="0.20.0"
          INSTALL_DIR="${HOME}/bin"

          mkdir -p "${INSTALL_DIR}"

          curl -sSL \
            -o terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"

          tar -xzf terraform-docs.tar.gz terraform-docs
          chmod +x terraform-docs
          mv terraform-docs "${INSTALL_DIR}/terraform-docs"

          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Render Terraform Docs
        # Render README updates for every module so the pull request can be
        # checked against the current generated reference.
        shell: bash
        run: |
          set -euo pipefail

          for module_dir in modules/*; do
            if [ -d "${module_dir}" ]; then
              terraform-docs --config .github/quality/terraform-docs.yml "${module_dir}"
            fi
          done

      - name: Verify Module READMEs Are Up to Date
        # Fail the pull request if terraform-docs would change committed
        # module documentation. This keeps README drift visible in review.
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --exit-code -- modules; then
            echo "Terraform module documentation is not up to date."
            echo "Refresh the generated README sections before merging this pull request."
            exit 1
          fi

  update-docs:
    # On branch pushes, the workflow can refresh generated module README
    # sections automatically instead of forcing maintainers to do it by hand.
    name: Update Module READMEs
    runs-on: ubuntu-latest
    needs:
      - discover-modules
    if: github.event_name != 'pull_request' && needs.discover-modules.outputs.has_modules == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install terraform-docs
        shell: bash
        run: |
          set -euo pipefail

          # We install terraform-docs manually to avoid depending on external
          # GitHub Actions that may be blocked by enterprise allowlists.
          TERRAFORM_DOCS_VERSION="0.20.0"
          INSTALL_DIR="${HOME}/bin"

          mkdir -p "${INSTALL_DIR}"

          curl -sSL \
            -o terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"

          tar -xzf terraform-docs.tar.gz terraform-docs
          chmod +x terraform-docs
          mv terraform-docs "${INSTALL_DIR}/terraform-docs"

          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Render Terraform Docs
        # Render README updates for every module in one pass so documentation
        # stays synchronized at repository level.
        shell: bash
        run: |
          set -euo pipefail

          for module_dir in modules/*; do
            if [ -d "${module_dir}" ]; then
              terraform-docs --config .github/quality/terraform-docs.yml "${module_dir}"
            fi
          done

      - name: Commit Updated READMEs
        # Only commit when terraform-docs actually changed generated module
        # sections. This avoids noisy empty commits on every push.
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- modules; then
            echo "No README changes detected after terraform-docs rendering."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modules
          git commit -m "docs(terraform): refresh module READMEs"
          git push

  no-modules:
    # This fallback job prevents the workflow from looking broken when the
    # repository is still being bootstrapped and no modules exist yet.
    name: No Modules Found
    runs-on: ubuntu-latest
    needs:
      - discover-modules
    if: needs.discover-modules.outputs.has_modules != 'true'

    steps:
      - name: Skip Documentation Update
        run: echo "No module directories found under modules/. Nothing to document yet."
