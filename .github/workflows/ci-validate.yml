# ============================================================================
# TERRAFORM VALIDATION WORKFLOW
# ============================================================================
# This workflow is the baseline quality gate for the terraform-modules
# repository.
#
# Its purpose is to validate each shared Terraform module independently before
# we introduce AWS-backed integration tests.
#
# WHAT THIS WORKFLOW CHECKS:
# - Terraform formatting across the repository
# - Terraform initialization for each module (without backend access)
# - Terraform structural validation for each module
# - TFLint checks when the runner provides the TFLint binary
#
# WHAT THIS WORKFLOW DOES NOT CHECK:
# - Real AWS authentication
# - Remote state backend access
# - terraform plan/apply against live environments
# - end-to-end integration with consumer repositories
#
# WHY THIS WORKFLOW MATTERS:
# - It provides a fast feedback loop on module quality
# - It keeps modules independently testable
# - It gives a safe CI baseline even before examples and OIDC flows are ready
# ============================================================================

name: Terraform Validate

# ============================================================================
# WORKFLOW TRIGGERS
# ============================================================================
# The workflow runs automatically when module code or validation configuration
# changes on the main integration branches. It can also be started manually
# from the GitHub Actions UI.
# ============================================================================
on:
  push:
    branches:
      - dev
      - main
    paths:
      - "modules/**"
      - ".github/workflows/ci-validate.yml"
      - ".tflint.hcl"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "modules/**"
      - ".github/workflows/ci-validate.yml"
      - ".tflint.hcl"
  workflow_dispatch: {}

# Minimal read-only permission is enough for checkout and validation.
permissions:
  contents: read

# ============================================================================
# JOBS
# ============================================================================
# The workflow is split into small jobs so that we can:
# - discover module directories dynamically
# - run repository-wide formatting once
# - validate each module independently in a matrix
# - exit cleanly when the repository does not contain modules yet
# ============================================================================
jobs:
  discover-modules:
    # This job builds the module list dynamically from modules/*.
    #
    # Why dynamic discovery?
    # - New modules are picked up automatically
    # - The workflow does not need to be edited for every new folder
    # - Validation remains scalable as the repository grows
    name: Discover Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
      has_modules: ${{ steps.discover.outputs.has_modules }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Discover Module Directories
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          # If the modules directory does not exist yet, publish an empty
          # result and let the workflow stop gracefully.
          if [ ! -d modules ]; then
            echo "modules=[]" >> "${GITHUB_OUTPUT}"
            echo "has_modules=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Build a JSON array of first-level module directories so it can be
          # consumed by a GitHub Actions matrix in the next job.
          MODULES_JSON=$(find modules -mindepth 1 -maxdepth 1 -type d | sort | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')

          if [ "${MODULES_JSON}" = "[]" ]; then
            echo "modules=[]" >> "${GITHUB_OUTPUT}"
            echo "has_modules=false" >> "${GITHUB_OUTPUT}"
          else
            echo "modules=${MODULES_JSON}" >> "${GITHUB_OUTPUT}"
            echo "has_modules=true" >> "${GITHUB_OUTPUT}"
          fi

  terraform-fmt:
    # Formatting is checked once for the whole repository because terraform fmt
    # is repository-wide by nature and does not need per-module isolation.
    name: Terraform Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        # We install Terraform manually to avoid the Node.js runtime warning
        # currently emitted by hashicorp/setup-terraform on this GitHub
        # Enterprise environment.
        run: |
          set -euo pipefail

          curl -sSL https://releases.hashicorp.com/terraform/1.9.5/terraform_1.9.5_linux_amd64.zip -o terraform.zip
          unzip -o terraform.zip
          sudo mv terraform /usr/local/bin/terraform
          chmod +x /usr/local/bin/terraform
          rm -f terraform.zip

      - name: Check Terraform Formatting
        # -check fails if any file would be reformatted.
        # -recursive ensures every Terraform file under the repository tree is
        # inspected, including future modules.
        run: terraform fmt -check -recursive

  validate-modules:
    # Each module is validated independently through a matrix.
    #
    # This gives clearer feedback than one large monolithic validation job:
    # - easier to identify which module is broken
    # - better scalability when more modules are added
    # - one failing module does not hide the status of the others
    name: Validate ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs:
      - discover-modules
      - terraform-fmt
    if: needs.discover-modules.outputs.has_modules == 'true'

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        # We install Terraform manually to avoid the Node.js runtime warning
        # currently emitted by hashicorp/setup-terraform on this GitHub
        # Enterprise environment.
        run: |
          set -euo pipefail

          curl -sSL https://releases.hashicorp.com/terraform/1.9.5/terraform_1.9.5_linux_amd64.zip -o terraform.zip
          unzip -o terraform.zip
          sudo mv terraform /usr/local/bin/terraform
          chmod +x /usr/local/bin/terraform
          rm -f terraform.zip

      - name: Show Tool Versions
        # Printing versions helps debugging CI issues and makes it easier to
        # compare local tooling with CI behavior.
        run: |
          terraform version

      - name: Resolve Terraform Validation Directory
        # Most modules can be validated directly from their own folder.
        # acm-cloudfront is the exception because it requires an aliased
        # provider (aws.us_east_1), so CI validates it through a dedicated
        # root module under examples/.
        id: validation-dir
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.module }}" in
            "modules/acm-cloudfront")
              echo "dir=examples/acm-cloudfront-validation" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "dir=${{ matrix.module }}" >> "${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Setup TFLint
        # We intentionally do not use terraform-linters/setup-tflint here
        # because some GitHub Enterprise policies block external actions that
        # are not explicitly approved.
        #
        # This variant installs the TFLint binary manually during the job.
        # It assumes the runner can:
        # - download from GitHub releases
        # - execute curl and unzip
        # - use sudo to move the binary into /usr/local/bin
        run: |
          set -euo pipefail

          curl -sSL https://github.com/terraform-linters/tflint/releases/download/v0.55.1/tflint_linux_amd64.zip -o tflint.zip
          unzip -o tflint.zip
          sudo mv tflint /usr/local/bin/tflint
          chmod +x /usr/local/bin/tflint
          rm -f tflint.zip

      - name: Terraform Init
        # Modules are initialized without a backend because shared modules
        # should be testable in isolation and do not manage remote state.
        #
        # This is exactly what we want in a module repository:
        # - download providers
        # - parse module dependencies
        # - avoid any dependency on S3 backends or AWS environments
        run: terraform -chdir="${{ steps.validation-dir.outputs.dir }}" init -backend=false -input=false

      - name: Terraform Validate
        # Structural validation checks whether the module configuration is
        # internally coherent once providers and dependencies are available.
        run: terraform -chdir="${{ steps.validation-dir.outputs.dir }}" validate

      - name: TFLint
        # TFLint adds an extra quality gate on top of terraform validate.
        # It helps catch conventions and provider-specific issues that
        # Terraform itself does not always flag during validation.
        run: tflint --chdir "${{ matrix.module }}"

      # AWS CLI is intentionally not installed in this workflow.
      # This validation pipeline is module-focused and backend-free:
      # - no AWS authentication is required
      # - no remote backend is initialized
      # - no live infrastructure commands are executed

  no-modules:
    # This fallback job prevents the workflow from looking broken when the
    # repository is still being bootstrapped and no modules exist yet.
    name: No Modules Found
    runs-on: ubuntu-latest
    needs:
      - discover-modules
      - terraform-fmt
    if: needs.discover-modules.outputs.has_modules != 'true'

    steps:
      - name: Skip Validation
        run: echo "No module directories found under modules/. Nothing to validate yet."
